<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Fusion - Products</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-auth { text-decoration: none; padding: 8px 16px; border-radius: 4px; font-weight: 500; }
    .btn-signin { color: #0d6efd; border: 1px solid #0d6efd; }
    .btn-signup { background-color: #198754; color: white; }

    /* Category Section Styling */
    .category-section {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e9ecef;
    }
    .category-section h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #212529;
      margin-bottom: 12px;
    }
    .category-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- 1. Header Section -->
  <header>
    <div class="logo-container">
      <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
        <img src="assets/codegnan-logo.jpeg" alt="Codegnan Logo" class="logo">
        <h2>Shop Fusion</h2>
      </a>
    </div>
    <div class="header-actions">
      <a href="index.html" style="text-decoration: none; color: #0d6efd; margin-right: 10px;">&larr; Home</a>
      <a href="signin.html" class="btn-auth btn-signin">Sign In</a>
      <a href="signup.html" class="btn-auth btn-signup">Sign Up</a>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 20px auto; padding: 0 15px;">
    
    <!-- 2. Category Filter Bar (Top Navigation) -->
    <section class="category-section">
      <h3>Browse Categories</h3>
      <div class="category-bar" id="categoryBar">
        <!-- Categories populated dynamically via js/custom.js -->
      </div>
    </section>

    <!-- 3. Product Display Section -->
    <section class="product-section">
      <h2 id="sectionTitle" style="margin-bottom: 20px; color: #333;">All Products</h2>
      
      <div class="product-grid" id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;">
        <p>Loading products...</p>
      </div>
    </section>

  </main>

  <!-- Connect to your external custom script (Handles categories + full product rendering) -->
  <script src="js/custom.js"></script>
</body>
</html>
